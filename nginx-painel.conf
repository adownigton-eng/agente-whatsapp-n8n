server {
    listen 80;
    server_name _;

    # ---- Audios que o WAHA busca em http://audios/arquivo.ogg (comportamento original) ----
    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
    }

    # ---- Painel Kanban do CRM ----
    location /painel/ {
        alias /painel/;
        index index.html;
        add_header Cache-Control "no-store";
    }

    # ---- API do CRM (proxy para o n8n): mesma origem, sem CORS ----
    # resolver do Docker + variavel: sobrevive a troca de IP do container n8n
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream "n8n:5678";
        rewrite ^/api/(.*)$ /webhook/$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
